    <text x="42.5" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">GARMENTS</text>
    <text x="100" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4B5272" letter-spacing="1">SPEC REF: WOVEN-04</text>
    <text x="680" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#C99A5B" text-anchor="end">ARTISTRY DHAKA</text>
  </g>

  <!-- Centered Product Illustration -->
  <g>
    
      <path d="M275 200 L345 180 L400 215 L455 180 L525 200 L490 440 L310 440 Z" fill="#1C2766" opacity="0.85"/>
      <polygon points="345,180 380,215 400,215 400,180" fill="#EEF0F6"/>
      <polygon points="455,180 420,215 400,215 400,180" fill="#EEF0F6"/>
      <line x1="400" y1="215" x2="400" y2="440" stroke="#DADDE8" stroke-width="1.5" stroke-dasharray="5,3"/>
      <circle cx="400" cy="250" r="3" fill="#C99A5B"/>
      <circle cx="400" cy="290" r="3" fill="#C99A5B"/>
      <circle cx="400" cy="330" r="3" fill="#C99A5B"/>
      <circle cx="400" cy="370" r="3" fill="#C99A5B"/>
      <rect x="330" y="260" width="35" height="40" rx="2" fill="none" stroke="#C99A5B" stroke-width="1.5" stroke-dasharray="3,2"/>
    
