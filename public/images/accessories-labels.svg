<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg_LABEL-05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F9FC" />
      <stop offset="100%" stop-color="#EEF0F6" />
    </linearGradient>
    <pattern id="grid_LABEL-05" width="24" height="24" patternUnits="userSpaceOnUse">
      <line x1="0" y1="12" x2="24" y2="12" stroke="#DADDE8" stroke-width="0.75" stroke-dasharray="2,4" opacity="0.5"/>
      <line x1="12" y1="0" x2="12" y2="24" stroke="#DADDE8" stroke-width="0.75" stroke-dasharray="2,4" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="800" height="600" fill="url(#bg_LABEL-05)" />
  <rect width="800" height="600" fill="url(#grid_LABEL-05)" />

  <!-- Frame border with Kraft stitch accent -->
  <rect x="24" y="24" width="752" height="552" rx="10" fill="none" stroke="#DADDE8" stroke-width="1.5" />
  <rect x="36" y="36" width="728" height="528" rx="8" fill="none" stroke="#C99A5B" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8" />

  <!-- Technical Spec Top Bar -->
  <g transform="translate(54, 52)">
    <rect x="0" y="0" width="85" height="24" rx="4" fill="#1C2766" />
    <text x="42.5" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">ACCESSORIES</text>
    <text x="100" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4B5272" letter-spacing="1">SPEC REF: LABEL-05</text>
    <text x="680" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#C99A5B" text-anchor="end">ARTISTRY DHAKA</text>
  </g>

  <!-- Centered Product Illustration -->
  <g>
    
      <rect x="260" y="200" width="280" height="160" rx="6" fill="#1C2766" stroke="#DADDE8" stroke-width="2"/>
      <rect x="275" y="215" width="250" height="130" rx="4" fill="none" stroke="#C99A5B" stroke-width="2" stroke-dasharray="5,3"/>
      <text x="400" y="265" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">ARTISTRY</text>
      <text x="400" y="295" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#C99A5B" text-anchor="middle" letter-spacing="2">100% COTTON • MADE IN BD</text>
      <circle cx="400" cy="318" r="4" fill="#D6332A"/>
      <path d="M260 360 L240 430 L320 430 L340 360 Z" fill="#EEF0F6" stroke="#DADDE8" stroke-width="1"/>
      <line x1="250" y1="420" x2="310" y2="420" stroke="#4B5272" stroke-width="1" stroke-dasharray="3,2"/>
    
  </g>

  <!-- Bottom Spec Card -->
  <g transform="translate(54, 480)">
    <rect x="0" y="0" width="692" height="58" rx="6" fill="#FFFFFF" stroke="#DADDE8" stroke-width="1" filter="drop-shadow(0 2px 6px rgba(20,28,79,0.04))" />
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#141C4F">Woven Brand Labels</text>
    <text x="20" y="46" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#4B5272">Damask High-Density Weave • Heat-Sealed Edges</text>
    <circle cx="660" cy="29" r="10" fill="#EEF0F6" />
    <circle cx="660" cy="29" r="4" fill="#D6332A" />
  </g>
</svg>