<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg_POLO-01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F9FC" />
      <stop offset="100%" stop-color="#EEF0F6" />
    </linearGradient>
    <pattern id="grid_POLO-01" width="24" height="24" patternUnits="userSpaceOnUse">
      <line x1="0" y1="12" x2="24" y2="12" stroke="#DADDE8" stroke-width="0.75" stroke-dasharray="2,4" opacity="0.5"/>
      <line x1="12" y1="0" x2="12" y2="24" stroke="#DADDE8" stroke-width="0.75" stroke-dasharray="2,4" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="800" height="600" fill="url(#bg_POLO-01)" />
  <rect width="800" height="600" fill="url(#grid_POLO-01)" />

  <!-- Frame border with Kraft stitch accent -->
  <rect x="24" y="24" width="752" height="552" rx="10" fill="none" stroke="#DADDE8" stroke-width="1.5" />
  <rect x="36" y="36" width="728" height="528" rx="8" fill="none" stroke="#C99A5B" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8" />

  <!-- Technical Spec Top Bar -->
  <g transform="translate(54, 52)">
    <rect x="0" y="0" width="85" height="24" rx="4" fill="#1C2766" />
    <text x="42.5" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">GARMENTS</text>
    <text x="100" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4B5272" letter-spacing="1">SPEC REF: POLO-01</text>
    <text x="680" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#C99A5B" text-anchor="end">ARTISTRY DHAKA</text>
  </g>

  <!-- Centered Product Illustration -->
  <g>
    
      <path d="M260 210 L340 180 L400 230 L460 180 L540 210 L500 270 L470 260 L470 440 L330 440 L330 260 L300 270 Z" fill="#1C2766" opacity="0.9"/>
      <path d="M370 195 L400 230 L430 195 L415 180 L385 180 Z" fill="#C99A5B"/>
      <path d="M385 230 L415 230 L415 310 L385 310 Z" fill="#FFFFFF" opacity="0.2"/>
      <circle cx="400" cy="255" r="3.5" fill="#D6332A"/>
      <circle cx="400" cy="285" r="3.5" fill="#C99A5B"/>
      <line x1="330" y1="435" x2="470" y2="435" stroke="#C99A5B" stroke-width="2" stroke-dasharray="4,3"/>
    
  </g>

  <!-- Bottom Spec Card -->
  <g transform="translate(54, 480)">
    <rect x="0" y="0" width="692" height="58" rx="6" fill="#FFFFFF" stroke="#DADDE8" stroke-width="1" filter="drop-shadow(0 2px 6px rgba(20,28,79,0.04))" />
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#141C4F">Export Polo Shirts</text>
    <text x="20" y="46" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#4B5272">100% Combed Cotton Pique • Reactive Dyed</text>
    <circle cx="660" cy="29" r="10" fill="#EEF0F6" />
    <circle cx="660" cy="29" r="4" fill="#D6332A" />
  </g>
</svg>