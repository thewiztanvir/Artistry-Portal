    <rect x="0" y="0" width="692" height="58" rx="6" fill="#FFFFFF" stroke="#DADDE8" stroke-width="1" filter="drop-shadow(0 2px 6px rgba(20,28,79,0.04))" />
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#141C4F">Poly Bag Assortment</text>
    <text x="20" y="46" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#4B5272">Recyclable LDPE Self-Adhesive Export Bags</text>
    <circle cx="660" cy="29" r="10" fill="#EEF0F6" />
    <circle cx="660" cy="29" r="4" fill="#D6332A" />
