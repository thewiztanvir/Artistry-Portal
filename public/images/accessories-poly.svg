  <!-- Centered Product Illustration -->
  <g>
    
      <rect x="280" y="180" width="240" height="260" rx="8" fill="#FFFFFF" stroke="#DADDE8" stroke-width="2"/>
      <path d="M280 180 L280 220 L520 220 L520 180 Z" fill="#EEF0F6" stroke="#DADDE8" stroke-width="1"/>
      <line x1="290" y1="200" x2="510" y2="200" stroke="#D6332A" stroke-width="3"/>
      <circle cx="400" cy="300" r="28" fill="none" stroke="#C99A5B" stroke-width="2.5" stroke-dasharray="6,3"/>
      <path d="M385 295 L400 310 L415 295" fill="none" stroke="#1C2766" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="400" y="360" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#4B5272" text-anchor="middle">100% RECYCLABLE LDPE</text>
      <circle cx="320" cy="410" r="4" fill="#DADDE8"/>
      <circle cx="480" cy="410" r="4" fill="#DADDE8"/>
    
