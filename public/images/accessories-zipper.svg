<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg_TRIM-07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F9FC" />
      <stop offset="100%" stop-color="#EEF0F6" />
    </linearGradient>
    <pattern id="grid_TRIM-07" width="24" height="24" patternUnits="userSpaceOnUse">
      <line x1="0" y1="12" x2="24" y2="12" stroke="#DADDE8" stroke-width="0.75" stroke-dasharray="2,4" opacity="0.5"/>
      <line x1="12" y1="0" x2="12" y2="24" stroke="#DADDE8" stroke-width="0.75" stroke-dasharray="2,4" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="800" height="600" fill="url(#bg_TRIM-07)" />
  <rect width="800" height="600" fill="url(#grid_TRIM-07)" />

  <!-- Frame border with Kraft stitch accent -->
  <rect x="24" y="24" width="752" height="552" rx="10" fill="none" stroke="#DADDE8" stroke-width="1.5" />
  <rect x="36" y="36" width="728" height="528" rx="8" fill="none" stroke="#C99A5B" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8" />

  <!-- Technical Spec Top Bar -->
  <g transform="translate(54, 52)">
    <rect x="0" y="0" width="85" height="24" rx="4" fill="#1C2766" />
    <text x="42.5" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">ACCESSORIES</text>
    <text x="100" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4B5272" letter-spacing="1">SPEC REF: TRIM-07</text>
    <text x="680" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#C99A5B" text-anchor="end">ARTISTRY DHAKA</text>
  </g>

  <!-- Centered Product Illustration -->
  <g>
    
      <line x1="350" y1="180" x2="350" y2="440" stroke="#1C2766" stroke-width="16" stroke-linecap="round"/>
      <line x1="350" y1="180" x2="350" y2="440" stroke="#C99A5B" stroke-width="8" stroke-dasharray="4,4"/>
      <rect x="335" y="270" width="30" height="45" rx="4" fill="#D6332A"/>
      <polygon points="340,315 360,315 350,345" fill="#D6332A"/>
      <circle cx="450" cy="240" r="32" fill="#1C2766" stroke="#C99A5B" stroke-width="3"/>
      <circle cx="450" cy="240" r="20" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3,2"/>
      <circle cx="444" cy="235" r="3" fill="#C99A5B"/>
      <circle cx="456" cy="235" r="3" fill="#C99A5B"/>
      <circle cx="444" cy="245" r="3" fill="#C99A5B"/>
      <circle cx="456" cy="245" r="3" fill="#C99A5B"/>
      <circle cx="460" cy="340" r="24" fill="#C99A5B" stroke="#1C2766" stroke-width="2"/>
      <circle cx="455" cy="336" r="2.5" fill="#141C4F"/>
      <circle cx="465" cy="336" r="2.5" fill="#141C4F"/>
      <circle cx="455" cy="344" r="2.5" fill="#141C4F"/>
      <circle cx="465" cy="344" r="2.5" fill="#141C4F"/>
    
  </g>

  <!-- Bottom Spec Card -->
  <g transform="translate(54, 480)">
    <rect x="0" y="0" width="692" height="58" rx="6" fill="#FFFFFF" stroke="#DADDE8" stroke-width="1" filter="drop-shadow(0 2px 6px rgba(20,28,79,0.04))" />
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#141C4F">Zipper & Button Set</text>
    <text x="20" y="46" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#4B5272">Branded Metal Shank Buttons & YKK Brass Zippers</text>
    <circle cx="660" cy="29" r="10" fill="#EEF0F6" />
    <circle cx="660" cy="29" r="4" fill="#D6332A" />
  </g>
